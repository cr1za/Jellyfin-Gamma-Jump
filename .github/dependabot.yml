version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: nuget
    directory: /plugin/Jellyfin.Plugin.GammaJump
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /plugin/Jellyfin.Plugin.GammaJump.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
